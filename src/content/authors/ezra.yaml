name: "השף עזרא"
bio: "אופה בורקס מזה ארבעים שנה. מאמין שבצק טוב משמיע רעש כשנוגסים בו."
role: "אופה ראשי"
about: "עזרא התחיל לאפות בגיל 14 במאפיית השכונה, ומאז לא יצא מהתנור. הוא מאמין בבצק עלים ביתי, בחמאה טובה ובמגש שיוצא רותח.\n\nהמתכונים שלו מתאימים גם למתחילים: כל צעד מוסבר, וכל סוד מופיע בטיפ."
quote: "אם הבצק לא עושה רעש של פיצוח כשנוגסים בו, תעצרו מיד ותתחילו מחדש."
banner: "../../assets/images/authors/ezra/banner.jpg"
bannerAlt: "מגש שבלולי תפוחי אדמה ובורקס חם על מגש אפייה"
